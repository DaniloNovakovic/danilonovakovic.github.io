<!doctype html>
<!--
  PROTOTYPE, THROWAWAY (#144 / #145). Not production, never imported by the app.
  Question: does a low-poly toon first-person alien ship read as an intentional
  "real life is 3D" break, and does movement feel good on desktop and touch?
  Three looks, switchable via ?variant=A|B|C, the bottom bar, or the arrow keys.
  Three.js is loaded lazily (dynamic import after "Wake up") from a CDN URL,
  so package.json is untouched. Run: `pnpm dev`, then open
  /src/game/shell/obShip3d.prototype.html (or double-click this file).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OB ship prototype</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; touch-action: none; }
      body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #d8d4ca; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100vw; height: 100dvh; }
      .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #050505; z-index: 10; text-align: center; padding: 16px; }
      [hidden] { display: none !important; }
      .card.dim { background: rgba(5,5,5,.72); }
      .card p { margin: 0; max-width: 28rem; }
      .card small { color: #8a8a8a; }
      .btn { border: 2px solid #d8d4ca; background: none; color: #d8d4ca; padding: 10px 18px; font: inherit; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
      .btn:hover, .btn:focus-visible { background: #d8d4ca; color: #050505; outline: none; }
      #hud { position: fixed; left: 8px; top: 8px; font-size: 11px; line-height: 1.45; background: rgba(0,0,0,.55); padding: 6px 8px; z-index: 5; white-space: pre; pointer-events: none; }
      #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 4; pointer-events: none; }
      #cross::before, #cross::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px #000; }
      #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
      #cross::after { top: 6px; left: 0; height: 2px; width: 14px; }
      #bar { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: #fff; color: #111; border-radius: 999px; padding: 4px 6px; font-size: 12px; z-index: 20; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
      #bar button { border: 0; background: #111; color: #fff; border-radius: 999px; width: 28px; height: 28px; cursor: pointer; font: inherit; }
      #touch { display: none; }
      body.touch #touch { display: block; }
      #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; z-index: 6; display: none; pointer-events: none; }
      #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.6); }
      #fire { position: fixed; right: 24px; bottom: 70px; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #111; background: #ff3b30; color: #fff; font: inherit; font-weight: 700; z-index: 6; }
      #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); font-size: 12px; color: #fff; text-shadow: 0 1px 2px #000; z-index: 5; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="cross" hidden></div>
    <div id="hint" hidden>WASD move · mouse look · click stun · Esc pause · ←/→ switch look</div>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <button id="fire" type="button">ZAP</button>
    </div>
    <div class="card" id="wake">
      <p>...signal lost. Somewhere that isn't a drawing, something opens its eyes.</p>
      <small>PROTOTYPE #144/#145: Three.js loads only when you press the button.</small>
      <button class="btn" id="wakeBtn" type="button" autofocus>Wake up</button>
    </div>
    <div class="card dim" id="pause" hidden>
      <p>Paused.</p>
      <button class="btn" id="resumeBtn" type="button">Click to keep going</button>
    </div>
    <div id="bar">
      <button id="prev" type="button" aria-label="Previous look">←</button>
      <span id="label"></span>
      <button id="next" type="button" aria-label="Next look">→</button>
    </div>

    <script type="module">
      const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
      const VARIANTS = {
        A: 'Toon + ink outlines',
        B: 'Flat low-poly, no lines',
        C: 'Ink edges on cream (sketch bridge)'
      };
      const KEYS = Object.keys(VARIANTS);
      let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      if (!VARIANTS[variant]) variant = 'A';
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isTouch = matchMedia('(pointer: coarse)').matches;
      if (isTouch) document.body.classList.add('touch');
      const $ = (id) => document.getElementById(id);
      const label = () => ($('label').textContent = `${variant} (${VARIANTS[variant]})`);
      label();

      let THREE, renderer, scene, camera, yaw, pitch, world, gun, loadMs = 0;
      let started = false, paused = false, stuns = 0, shots = 0;
      const aliens = [];
      const wallBoxes = [];

      function switchVariant(dir) {
        variant = KEYS[(KEYS.indexOf(variant) + dir + KEYS.length) % KEYS.length];
        history.replaceState(null, '', `?variant=${variant}`);
        label();
        if (THREE) buildWorld();
      }
      $('prev').onclick = (e) => { e.stopPropagation(); switchVariant(-1); };
      $('next').onclick = (e) => { e.stopPropagation(); switchVariant(1); };
      addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') switchVariant(-1);
        if (e.key === 'ArrowRight') switchVariant(1);
      });

      // ---------- map: '#' wall, 'P' start, 'A' alien, 'C' crate, 'O' pod ----------
      const MAP = [
        '###########',
        '#O..#.....#',
        '#.P.#.##C.#',
        '#...A..#..#',
        '##.###.#A.#',
        '#....C....#',
        '#.##.####.#',
        '#A.#...A..#',
        '###########'
      ];
      const CELL = 4, H = 3.2, R = 0.35;
      const isWall = (x, z) => {
        const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
        return (MAP[cz]?.[cx] ?? '#') === '#';
      };
      function collide(pos, dx, dz) {
        const nx = pos.x + dx;
        if (!isWall(nx + Math.sign(dx) * R, pos.z - R) && !isWall(nx + Math.sign(dx) * R, pos.z + R)) pos.x = nx;
        const nz = pos.z + dz;
        if (!isWall(pos.x - R, nz + Math.sign(dz) * R) && !isWall(pos.x + R, nz + Math.sign(dz) * R)) pos.z = nz;
      }

      // ---------- materials per look ----------
      let PAL;
      function palette() {
        if (variant === 'C') return { bg: 0xf4efe2, wall: 0xf7f2e6, floor: 0xece5d3, ceil: 0xf7f2e6, strip: 0xbfd4ff, alien: 0xd9f2c4, crate: 0xf1e2c2, line: 0x2b4cc4, eye: 0xffffff, pupil: 0x1a1a1a, fog: false };
        if (variant === 'B') return { bg: 0x1d1033, wall: 0x6d4bb0, floor: 0x3a2a63, ceil: 0x2a1c4a, strip: 0x5ff2ff, alien: 0x7cff6b, crate: 0xff9f1c, line: null, eye: 0xffffff, pupil: 0x111111, fog: true };
        return { bg: 0x241638, wall: 0x8a6bd8, floor: 0x4a3a7a, ceil: 0x33245a, strip: 0x66f0ff, alien: 0x8bff5a, crate: 0xffa630, line: 0x140f1e, eye: 0xffffff, pupil: 0x111111, fog: false };
      }
      let toonGradient;
      function surface(color, opts = {}) {
        if (variant === 'A') return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient, ...opts });
        if (variant === 'B') return new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts });
        return new THREE.MeshBasicMaterial({ color, ...opts }); // C: flat paper fills, the lines carry the form
      }
      function outlineMaterial(thick) {
        return new THREE.ShaderMaterial({
          side: THREE.BackSide,
          uniforms: { thick: { value: thick }, color: { value: new THREE.Color(PAL.line) } },
          vertexShader: 'uniform float thick; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * thick, 1.0); }',
          fragmentShader: 'uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); }'
        });
      }
      /** Ink for a mesh: A = hull outline on round things + edge lines on boxy things; C = edge lines everywhere; B = none. */
      function ink(mesh, { round = false, thick = 0.035 } = {}) {
        if (!PAL.line) return mesh;
        if (variant === 'A' && round) {
          mesh.add(new THREE.Mesh(mesh.geometry, outlineMaterial(thick)));
        } else {
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(mesh.geometry, round ? 35 : 20),
            new THREE.LineBasicMaterial({ color: PAL.line })
          );
          mesh.add(edges);
        }
        return mesh;
      }
      function floorTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const g = c.getContext('2d');
        g.fillStyle = '#' + new THREE.Color(PAL.floor).getHexString();
        g.fillRect(0, 0, 128, 128);
        g.strokeStyle = variant === 'C' ? 'rgba(43,76,196,.55)' : 'rgba(0,0,0,.35)';
        g.lineWidth = variant === 'C' ? 2 : 4;
        g.strokeRect(2, 2, 124, 124);
        g.beginPath(); g.moveTo(64, 2); g.lineTo(64, 126); g.moveTo(2, 64); g.lineTo(126, 64); g.stroke();
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(MAP[0].length, MAP.length);
        t.colorSpace = THREE.SRGBColorSpace;
        t.magFilter = THREE.NearestFilter;
        return t;
      }

      // ---------- world ----------
      function makeAlien(x, z) {
        const g = new THREE.Group();
        const body = ink(new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), surface(PAL.alien)), { round: true });
        body.scale.set(1, 1.15, 1);
        g.add(body);
        for (const side of [-1, 1]) {
          const eye = ink(new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 6), surface(PAL.eye)), { round: true, thick: 0.03 });
          eye.position.set(side * 0.25, 0.25, 0.58);
          const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 6, 4), new THREE.MeshBasicMaterial({ color: PAL.pupil }));
          pupil.position.set(0, 0, 0.17);
          eye.add(pupil);
          g.add(eye);
        }
        const stalk = ink(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 5), surface(PAL.alien)));
        stalk.position.set(0, 1.0, 0);
        const tip = ink(new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 4), surface(0xff3b30)), { round: true, thick: 0.02 });
        tip.position.set(0, 1.28, 0);
        g.add(stalk, tip);
        // the alert-red tell, shown when it's close
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const cx = c.getContext('2d'); cx.font = 'bold 56px sans-serif'; cx.textAlign = 'center';
        cx.lineWidth = 8; cx.strokeStyle = '#111'; cx.strokeText('!', 32, 54); cx.fillStyle = '#e8392b'; cx.fillText('!', 32, 54);
        const tell = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
        tell.scale.set(0.6, 0.6, 1); tell.position.set(0, 1.75, 0); tell.visible = false;
        g.add(tell);
        const stars = new THREE.Group();
        for (let i = 0; i < 3; i++) {
          const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xffd400 }));
          s.position.set(Math.cos((i / 3) * Math.PI * 2) * 0.5, 0, Math.sin((i / 3) * Math.PI * 2) * 0.5);
          stars.add(s);
        }
        stars.position.y = 1.4; stars.visible = false;
        g.add(stars);
        g.position.set(x, 0.9, z);
        return { g, body, tell, stars, state: 'walk', t: 0, phase: Math.random() * 6 };
      }

      function buildWorld() {
        if (world) {
          scene.remove(world);
          world.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); });
        }
        if (gun) { camera.remove(gun); }
        PAL = palette();
        aliens.length = 0; wallBoxes.length = 0;
        world = new THREE.Group();
        scene.background = new THREE.Color(PAL.bg);
        scene.fog = PAL.fog ? new THREE.Fog(PAL.bg, 6, 26) : null;

        world.add(new THREE.HemisphereLight(0xffffff, 0x554477, variant === 'B' ? 1.6 : 1.9));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(0.6, 1, 0.35);
        world.add(sun);

        const W = MAP[0].length * CELL, D = MAP.length * CELL;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), surface(0xffffff, { map: floorTexture() }));
        floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, D / 2);
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), surface(PAL.ceil));
        ceil.rotation.x = Math.PI / 2; ceil.position.set(W / 2, H, D / 2);
        world.add(floor, ceil);

        const wallGeo = new THREE.BoxGeometry(CELL, H, CELL);
        const wallMat = surface(PAL.wall);
        const stripMat = new THREE.MeshBasicMaterial({ color: PAL.strip });
        MAP.forEach((row, z) => [...row].forEach((ch, x) => {
          const cx = x * CELL + CELL / 2, cz = z * CELL + CELL / 2;
          if (ch === '#') {
            const m = ink(new THREE.Mesh(wallGeo, wallMat));
            m.position.set(cx, H / 2, cz);
            world.add(m); wallBoxes.push(m);
          } else {
            const strip = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.3), stripMat);
            strip.position.set(cx, H - 0.04, cz);
            world.add(strip);
          }
          if (ch === 'C') {
            const crate = ink(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), surface(PAL.crate)));
            crate.position.set(cx + 1.1, 0.6, cz - 1.1); crate.rotation.y = 0.4;
            world.add(crate); wallBoxes.push(crate);
          }
          if (ch === 'O') {
            const base = ink(new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 0.4, 8), surface(PAL.wall)));
            base.position.set(cx, 0.2, cz);
            const glass = ink(new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 2.2, 8, 1, true), surface(PAL.strip, { transparent: true, opacity: 0.35, side: THREE.DoubleSide })));
            glass.position.set(cx, 1.5, cz);
            world.add(base, glass);
          }
          if (ch === 'A') { const a = makeAlien(cx, cz); aliens.push(a); world.add(a.g); }
        }));
        scene.add(world);

        // chunky stun blaster in hand
        gun = new THREE.Group();
        const gb = ink(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.5), surface(0x3b3f52)));
        const grip = ink(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.22, 0.12), surface(0x2a2d3b)));
        grip.position.set(0, -0.15, 0.14); grip.rotation.x = 0.3;
        const coil = ink(new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.035, 5, 8), surface(0x8bff5a)));
        coil.position.set(0, 0, -0.18);
        const tipG = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial({ color: 0x8bff5a }));
        tipG.position.set(0, 0, -0.28);
        gun.add(gb, grip, coil, tipG);
        gun.scale.setScalar(0.55);
        gun.position.set(0.2, -0.17, -0.42);
        gun.traverse((o) => { if (o.material) { o.material.depthTest = false; o.renderOrder = 10; } });
        camera.add(gun);
      }

      // ---------- input ----------
      const keys = {};
      addEventListener('keydown', (e) => { keys[e.code] = true; });
      addEventListener('keyup', (e) => { keys[e.code] = false; });
      const look = { dx: 0, dy: 0 };
      const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
      let lookId = null, lastLX = 0, lastLY = 0;
      addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) { look.dx += e.movementX * 0.0022; look.dy += e.movementY * 0.0022; }
      });
      function onDown(e) {
        if (!started || paused || e.pointerType !== 'touch') return;
        if (e.target.closest('#bar, #fire')) return;
        if (e.clientX < innerWidth / 2 && stick.id === null) {
          Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0 });
          const s = $('stick'); s.style.display = 'block'; s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
        } else if (lookId === null) { lookId = e.pointerId; lastLX = e.clientX; lastLY = e.clientY; }
      }
      function onMove(e) {
        if (e.pointerId === stick.id) {
          let x = e.clientX - stick.ox, y = e.clientY - stick.oy;
          const len = Math.hypot(x, y), max = 50;
          if (len > max) { x = (x / len) * max; y = (y / len) * max; }
          stick.x = x / max; stick.y = y / max;
          $('knob').style.transform = `translate(${x}px, ${y}px)`;
        } else if (e.pointerId === lookId) {
          look.dx += (e.clientX - lastLX) * 0.006; look.dy += (e.clientY - lastLY) * 0.006;
          lastLX = e.clientX; lastLY = e.clientY;
        }
      }
      function onUp(e) {
        if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; $('stick').style.display = 'none'; $('knob').style.transform = ''; }
        if (e.pointerId === lookId) lookId = null;
      }
      addEventListener('pointerdown', onDown); addEventListener('pointermove', onMove);
      addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
      $('fire').addEventListener('pointerdown', (e) => { e.preventDefault(); fire(); });
      $('c').addEventListener('mousedown', (e) => {
        if (!started || isTouch || e.button !== 0) return;
        if (!document.pointerLockElement) { $('c').requestPointerLock(); return; }
        fire();
      });
      document.addEventListener('pointerlockchange', () => {
        if (!isTouch && started && !document.pointerLockElement) setPaused(true);
      });
      function setPaused(p) {
        paused = p;
        $('pause').hidden = !p;
        $('cross').hidden = p;
        if (p) $('resumeBtn').focus();
      }
      $('resumeBtn').onclick = () => {
        setPaused(false);
        if (!isTouch) $('c').requestPointerLock();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      };
      addEventListener('keydown', (e) => { if (e.key === 'Escape' && isTouch && started) setPaused(!paused); });

      // ---------- sound ----------
      let ac;
      function blip(type) {
        try {
          ac ??= new AudioContext();
          const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
          o.connect(g); g.connect(ac.destination);
          if (type === 'zap') { o.type = 'square'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.12); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14); o.stop(t + 0.15); }
          else { o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(660, t + 0.12); o.frequency.exponentialRampToValueAtTime(110, t + 0.4); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45); o.stop(t + 0.46); }
          o.start(t);
        } catch {}
      }

      // ---------- fire ----------
      let recoil = 0, tracer = null;
      function fire() {
        if (!started || paused) return;
        shots++; blip('zap');
        if (!reduced) recoil = 1;
        const ray = new THREE.Raycaster();
        ray.setFromCamera(new THREE.Vector2(0, 0), camera);
        const targets = [...wallBoxes, ...aliens.filter((a) => a.state === 'walk').map((a) => a.body)];
        const hit = ray.intersectObjects(targets, false)[0];
        const end = hit ? hit.point : ray.ray.at(30, new THREE.Vector3());
        const start = new THREE.Vector3(0.2, -0.17, -0.6).applyMatrix4(camera.matrixWorld);
        if (tracer) world.remove(tracer);
        tracer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), new THREE.LineBasicMaterial({ color: 0x8bff5a }));
        tracer.userData.t = 0.08; world.add(tracer);
        const a = hit && aliens.find((x) => x.body === hit.object);
        if (a) { a.state = 'stunned'; a.t = 0; stuns++; setTimeout(() => blip('boing'), 40); }
      }

      // ---------- loop ----------
      const clock = { last: 0 };
      const vel = { x: 0, z: 0 };
      let fps = 60;
      function tick(now) {
        requestAnimationFrame(tick);
        const dt = Math.min(0.05, (now - clock.last) / 1000 || 0.016);
        clock.last = now;
        fps = fps * 0.95 + (1 / dt) * 0.05;
        if (!paused) {
          yaw.rotation.y -= look.dx; pitch.rotation.x = Math.max(-1.3, Math.min(1.3, pitch.rotation.x - look.dy));
          let f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;
          let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
          const len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
          const speed = 4.5, ry = yaw.rotation.y;
          const tx = (-Math.sin(ry) * f + Math.cos(ry) * s) * speed, tz = (-Math.cos(ry) * f - Math.sin(ry) * s) * speed;
          const k = 1 - Math.exp(-dt * 14);
          vel.x += (tx - vel.x) * k; vel.z += (tz - vel.z) * k;
          collide(yaw.position, vel.x * dt, vel.z * dt);

          const p = yaw.position;
          for (const a of aliens) {
            a.t += dt;
            const dx = p.x - a.g.position.x, dz = p.z - a.g.position.z, d = Math.hypot(dx, dz);
            if (a.state === 'walk') {
              a.g.rotation.set(0, Math.atan2(dx, dz), 0);
              if (d < 14 && d > 1.9) collide(a.g.position, (dx / d) * 1.3 * dt, (dz / d) * 1.3 * dt);
              a.g.position.y = 0.9 + (reduced ? 0 : Math.sin(a.t * 4 + a.phase) * 0.08);
              a.tell.visible = d < 3.2;
              a.stars.visible = false; a.body.scale.set(1, 1.15, 1);
            } else {
              a.tell.visible = false;
              const puff = a.t < 0.15 && !reduced ? 1 + (a.t / 0.15) * 0.35 : 1;
              a.body.scale.set(puff, 1.15 * puff, puff);
              const flop = reduced ? 1 : Math.min(1, Math.max(0, (a.t - 0.15) / 0.25));
              a.g.rotation.x = -flop * Math.PI / 2; a.g.position.y = 0.9 - flop * 0.35;
              a.stars.visible = a.t > 0.3; a.stars.rotation.y += reduced ? 0 : dt * 4;
              if (a.t > 5) { a.state = 'walk'; a.t = 0; a.g.rotation.x = 0; }
            }
          }
        }
        look.dx = look.dy = 0;
        if (gun) {
          recoil = Math.max(0, recoil - dt * 8);
          gun.position.z = -0.42 + recoil * 0.05;
          gun.rotation.x = recoil * 0.25;
        }
        if (tracer && (tracer.userData.t -= dt) <= 0) { world.remove(tracer); tracer = null; }
        renderer.render(scene, camera);
        const info = renderer.info.render;
        $('hud').textContent =
          `PROTOTYPE #144/#145   look ${variant}: ${VARIANTS[variant]}\n` +
          `three r${THREE.REVISION} lazy-loaded in ${loadMs} ms\n` +
          `fps ${fps.toFixed(0)}  draws ${info.calls}  tris ${info.triangles}\n` +
          `input ${isTouch ? 'touch (stick + drag + ZAP)' : 'mouse+WASD'}  locked ${!!document.pointerLockElement}  fullscreen ${!!document.fullscreenElement}\n` +
          `pos ${yaw.position.x.toFixed(1)},${yaw.position.z.toFixed(1)}  shots ${shots}  stuns ${stuns}  reduced-motion ${reduced}`;
      }

      // ---------- wake up: the lazy boundary ----------
      $('wakeBtn').onclick = async () => {
        $('wakeBtn').disabled = true;
        document.documentElement.requestFullscreen?.().catch(() => {});
        const t0 = performance.now();
        THREE = await import(/* @vite-ignore */ THREE_URL);
        loadMs = Math.round(performance.now() - t0);
        toonGradient = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
        toonGradient.minFilter = toonGradient.magFilter = THREE.NearestFilter; toonGradient.needsUpdate = true;
        renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 80);
        yaw = new THREE.Object3D(); pitch = new THREE.Object3D();
        yaw.add(pitch); pitch.add(camera); scene.add(yaw);
        const start = MAP.findIndex((r) => r.includes('P'));
        yaw.position.set(MAP[start].indexOf('P') * CELL + CELL / 2, 1.6, start * CELL + CELL / 2);
        yaw.rotation.y = Math.PI; // face the corridor
        const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
        addEventListener('resize', resize); resize();
        buildWorld();
        $('wake').hidden = true; $('cross').hidden = false; $('hint').hidden = isTouch;
        started = true;
        if (!isTouch) $('c').requestPointerLock();
        requestAnimationFrame(tick);
      };
    </script>
  </body>
</html>
